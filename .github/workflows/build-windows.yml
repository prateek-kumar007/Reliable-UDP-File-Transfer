name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Compile source
        run: python -m compileall -q src

      - name: Build Windows GUI bundle
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name ReliableUDPFileTransfer --paths src
          src/reliable_udp/gui/app.py

      - name: Add quick-start instructions and zip the bundle
        shell: pwsh
        run: |
          @"
          Reliable UDP File Transfer - Windows build

          1. Extract this entire ZIP into a normal folder.
          2. Run ReliableUDPFileTransfer.exe.
          3. To test locally, launch two instances.
          4. Receiver: choose Receive files, select a destination folder, port 5001, then Start listening.
          5. Sender: choose Send a file, select the source file, enter 127.0.0.1 and port 5001, then Start transfer.
          6. Use a destination folder that does not already contain the incoming filename.
          7. For two laptops, use the receiver laptop's reachable IPv4 address and ensure UDP is allowed by the network firewall.
          8. History is stored in %USERPROFILE%\.reliable_udp\transfer_history.json.
          "@ | Set-Content dist/ReliableUDPFileTransfer/QUICK_START.txt -Encoding utf8

          Compress-Archive -Path dist/ReliableUDPFileTransfer/* -DestinationPath dist/ReliableUDPFileTransfer-Windows-x64.zip -Force

      - name: Upload ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReliableUDPFileTransfer-Windows-x64
          path: dist/ReliableUDPFileTransfer-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach ZIP to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ReliableUDPFileTransfer-Windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
